<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>弹球爬塔 · ZCode Games</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:none; }
  html,body { height:100%; background:#141a26; overflow:hidden; user-select:none;
              font-family:"Segoe UI",system-ui,sans-serif; display:flex; align-items:center; justify-content:center; }
  #wrap { position:relative; }
  canvas { display:block; border-radius:10px; background:#1c2740; }
  #over { position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
          justify-content:center; background:rgba(8,12,20,.75); border-radius:10px; color:#fff; }
  #over h2 { font-size:2rem; margin-bottom:8px; }
  #over p { color:#cfd8e3; margin-bottom:18px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="over"><h2>被追上了</h2><p id="final"></p><p>点击任意处再来一局</p></div>
</div>
<script src="matter.min.js"></script>
<script>
"use strict";
const {Engine,World,Bodies,Body,Events} = Matter;
const W=420, H=700, LAUNCH=H-80, ROWH=26, START_VOLLEY=4;
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const overEl=document.getElementById("over"), finalEl=document.getElementById("final");
function fit(){
  const s=Math.min(innerWidth/W, innerHeight/H);
  cv.style.width=(W*s)+"px"; cv.style.height=(H*s)+"px";
  cv.width=W*devicePixelRatio; cv.height=H*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener("resize",fit); fit();

let engine, bricks=[], powers=[], balls=[], volley=START_VOLLEY,
    score=0, best=+localStorage.getItem("ballzBest")||0,
    aiming=false, aimStart=null, aimEnd=null, phase="aim",
    rowsDown=0, over=false, fireTimer=0, firedThisVolley=0,
    settleTimer=0, last=performance.now();

const COLS=5, BW=(W-30)/COLS;
function newGame(){
  if(engine) World.clear(engine.world), Engine.clear(engine);
  engine=Engine.create(); engine.gravity.y=1;
  bricks=[]; powers=[]; balls=[]; volley=START_VOLLEY;
  score=0; rowsDown=0; over=false; phase="aim"; firedThisVolley=0;
  World.add(engine.world,[
    Bodies.rectangle(-30,H/2,60,H*3,{isStatic:true}),
    Bodies.rectangle(W+30,H/2,60,H*3,{isStatic:true})
  ]);
  addRow(-ROWH/2);
  addRow(ROWH*1.5);          // some tower already on screen at the start
  addRow(ROWH*1.5+ROWH);
  overEl.style.display="none";
}
function addRow(y0){
  const top = y0===undefined ? -ROWH/2 : y0;
  const hpBase=rowsDown+1;
  for(let c=0;c<COLS;c++){
    if(Math.random()<0.18)continue;                     // gaps keep it easy
    const x=15+BW*(c+0.5);
    const hp=1+Math.random()*Math.min(9,hpBase)|0;
    const b=Bodies.rectangle(x,top,BW-6,ROWH,{isStatic:true});
    b.plugin={hp:Math.max(1,hp)};
    bricks.push(b); World.add(engine.world,b);
  }
  if(y0===undefined&&Math.random()<0.35){
    const c=Math.random()*COLS|0;
    const p=Bodies.circle(15+BW*(c+0.5),-ROWH/2,11,{isStatic:true,isSensor:true});
    p.plugin={power:true};
    powers.push(p); World.add(engine.world,p);
  }
}
function descend(){
  rowsDown++;
  for(const b of bricks.concat(powers)){
    Body.setPosition(b,{x:b.position.x,y:b.position.y+ROWH});
  }
  for(const b of bricks){
    if(b.position.y+ROWH/2>=LAUNCH-6){
      over=true;
      if(score>best){best=score;localStorage.setItem("ballzBest",best);}
      finalEl.textContent="得分 "+score+" · 最高 "+best;
      overEl.style.display="flex";
      return;
    }
  }
  addRow();
}
function fireOne(vx,vy){
  const b=Bodies.circle(W/2,LAUNCH-12,6.5,{restitution:1,frictionAir:0,friction:0,density:.0008});
  b.plugin={ball:true,born:performance.now()};
  Body.setVelocity(b,{x:vx,y:vy});
  balls.push(b); World.add(engine.world,b);
}
function aimVec(){
  const dx=aimEnd.x-aimStart.x, dy=aimEnd.y-aimStart.y;
  const len=Math.hypot(dx,dy);
  if(len<15)return null;
  const k=Math.min(22,len*0.11)/len;
  return {x:dx*k,y:dy*k};
}
cv.addEventListener("touchstart",e=>{
  if(over){newGame();return;}
  if(phase!=="aim")return;
  aiming=true; aimStart=toWorld(e.touches[0]); aimEnd=aimStart; e.preventDefault();
},{passive:false});
cv.addEventListener("touchmove",e=>{ if(aiming)aimEnd=toWorld(e.touches[0]); e.preventDefault(); },{passive:false});
cv.addEventListener("touchend",()=>{
  if(!aiming)return; aiming=false;
  const v=aimVec(); if(!v)return;
  phase="fire"; firedThisVolley=0; fireTimer=0; settleTimer=0;
});
function toWorld(t){
  const r=cv.getBoundingClientRect(), s=W/r.width;
  return {x:(t.clientX-r.left)*s, y:(t.clientY-r.top)*s};
}
cv.addEventListener("mousedown",e=>{ if(over){newGame();return;} if(phase!=="aim")return;
  aiming=true; aimStart={x:e.offsetX,y:e.offsetY}; aimEnd=aimStart; });
cv.addEventListener("mousemove",e=>{ if(aiming)aimEnd={x:e.offsetX,y:e.offsetY}; });
cv.addEventListener("mouseup",()=>{ if(!aiming)return; aiming=false;
  const v=aimVec(); if(!v)return; phase="fire"; firedThisVolley=0; fireTimer=0; settleTimer=0; });
function drawAim(){
  const v=aimVec(); if(!v)return;
  let px=W/2, py=LAUNCH-12, vx=v.x, vy=v.y;
  ctx.fillStyle="rgba(255,255,255,.5)";
  for(let i=0;i<40;i++){
    vy+=0.278; px+=vx; py+=vy;
    if(i%3===0){ctx.beginPath();ctx.arc(px,py,3.5,0,7);ctx.fill();}
    if(py>H||px<0||px>W)break;
  }
}
function render(dt){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle="rgba(255,255,255,.16)"; ctx.setLineDash([6,6]);
  ctx.beginPath(); ctx.moveTo(0,LAUNCH); ctx.lineTo(W,LAUNCH); ctx.stroke(); ctx.setLineDash([]);
  for(const b of bricks){
    const hp=b.plugin.hp;
    ctx.fillStyle=hp>6?"#e17055":hp>3?"#f9ca24":"#6ab04c";
    ctx.fillRect(b.position.x-BW/2+3,b.position.y-ROWH/2,BW-6,ROWH);
    ctx.fillStyle="#fff"; ctx.font="14px sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(hp,b.position.x,b.position.y);
  }
  for(const p of powers){
    ctx.beginPath(); ctx.arc(p.position.x,p.position.y,11,0,7);
    ctx.fillStyle="#48dbfb"; ctx.fill();
    ctx.fillStyle="#fff"; ctx.font="13px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("+",p.position.x,p.position.y);
  }
  for(const b of balls){
    ctx.beginPath(); ctx.arc(b.position.x,b.position.y,6.5,0,7);
    ctx.fillStyle="#fff"; ctx.fill();
  }
  // launcher
  ctx.beginPath(); ctx.arc(W/2,LAUNCH-12,10,0,7); ctx.fillStyle="#54a0ff"; ctx.fill();
  ctx.font="15px sans-serif"; ctx.fillStyle="#fff"; ctx.textAlign="left";
  ctx.fillText("球 ×"+volley+"  得分 "+score+"  最高 "+best,14,26);
  if(aiming)drawAim();
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(!over){
    Engine.update(engine,1000/60);
    if(phase==="fire"){
      fireTimer+=dt;
      if(firedThisVolley<volley&&fireTimer>0.09){
        fireTimer=0; firedThisVolley++;
        const v=aimVec()||{x:0,y:-10};
        fireOne(v.x,v.y);
      }
      if(firedThisVolley>=volley){
        settleTimer+=dt;
        const alive=balls.filter(b=>now-b.plugin.born<9000&&b.position.y<H+40&&b.position.y<LAUNCH+40);
        if(settleTimer>3||alive.length===0){
          for(const b of balls)World.remove(engine.world,b);
          balls=[];
          descend();
          if(!over)phase="aim";
        }
      }
    }
  }
  render(dt);
  requestAnimationFrame(loop);
}
newGame();
Events.on(engine,"collisionStart",e=>{
  for(const p of e.pairs){
    const [a,b]=[p.bodyA,p.bodyB];
    const ball=a.plugin&&a.plugin.ball?a:b.plugin&&b.plugin.ball?b:null;
    if(!ball)continue;
    const other=ball===a?b:a;
    if(other.plugin&&other.plugin.hp!==undefined&&other.plugin.hp>0){
      other.plugin.hp--;
      if(other.plugin.hp<=0){
        score++;
        World.remove(engine.world,other);
        bricks=bricks.filter(x=>x!==other);
      }
    }
    if(other.plugin&&other.plugin.power){
      volley++; World.remove(engine.world,other);
      powers=powers.filter(x=>x!==other);
    }
  }
});
requestAnimationFrame(loop);
</script>
</body>
</html>
