<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>2048 · ZCode Games</title>
<style>
  :root { --cell:#cdc1b4; --bg:#faf8ef; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg);
         display:flex; flex-direction:column; align-items:center; min-height:100vh;
         touch-action:none; user-select:none; }
  h1 { font-size:clamp(2rem,8vw,3rem); color:#776e65; margin:12px 0 4px; }
  .bar { display:flex; gap:8px; margin:6px 0 12px; }
  .score { background:#bbada0; color:#fff; border-radius:6px; padding:6px 16px;
           text-align:center; min-width:80px; }
  .score small { display:block; font-size:.7rem; color:#eee; }
  .score b { font-size:1.2rem; }
  #board { position:relative; background:#bbada0; border-radius:8px;
           width:min(92vw,440px); height:min(92vw,440px); }
  .tile { position:absolute; border-radius:6px; display:flex; align-items:center;
          justify-content:center; font-weight:700; transition:transform .08s ease;
          background:#eee4da; color:#776e65; }
  .t2{background:#eee4da}.t4{background:#ede0c8}.t8{background:#f2b179;color:#fff}
  .t16{background:#f59563;color:#fff}.t32{background:#f67c5f;color:#fff}
  .t64{background:#f65e3b;color:#fff}.t128{background:#edcf72;color:#fff}
  .t256{background:#edcc61;color:#fff}.t512{background:#edc850;color:#fff}
  .t1024{background:#edc53f;color:#fff}.t2048{background:#edc22e;color:#fff}
  .super{background:#3c3a32;color:#fff}
  #msg { margin-top:14px; color:#776e65; font-size:1rem; min-height:1.5em; }
  #btn { margin-top:6px; font-size:1rem; padding:10px 28px; border:0; border-radius:6px;
         background:#8f7a66; color:#fff; cursor:pointer; }
  .hint { margin-top:10px; color:#a89f94; font-size:.85rem; }
</style>
</head>
<body>
<h1>2048</h1>
<div class="bar">
  <div class="score"><small>分数</small><b id="score">0</b></div>
  <div class="score"><small>最高</small><b id="best">0</b></div>
</div>
<div id="board"></div>
<div id="msg"></div>
<button id="btn">新游戏</button>
<div class="hint">滑动或用方向键移动方块</div>
<script>
"use strict";
const N=4, board=document.getElementById("board"),
      scoreEl=document.getElementById("score"), bestEl=document.getElementById("best"),
      msgEl=document.getElementById("msg");
let grid, score=0, best=+localStorage.getItem("best2048")||0, over=false, idSeq=0, tiles=new Map();
bestEl.textContent=best;

function newGame(){
  tiles.forEach(t=>t.el.remove()); tiles.clear();
  grid=Array.from({length:N},()=>Array(N).fill(null));
  score=0; over=false; msgEl.textContent="";
  add(); add(); render(true);
}
function emptyCells(){const r=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!grid[y][x])r.push([x,y]);return r;}
function add(){
  const c=emptyCells(); if(!c.length) return;
  const [x,y]=c[Math.random()*c.length|0];
  const v=Math.random()<0.9?2:4, id=++idSeq;
  grid[y][x]={v,id};
}
function render(create){
  const size=board.clientWidth, gap=size/(N+1)/1.8, cell=(size-gap*(N+1))/N;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=grid[y][x]; if(!t) continue;
    let e=tiles.get(t.id);
    if(!e){
      const el=document.createElement("div");
      el.className="tile"; board.appendChild(el);
      e={el}; tiles.set(t.id,e);
    }
    e.el.className="tile "+(t.v<=2048?"t"+t.v:"super");
    e.el.style.width=e.el.style.height=cell+"px";
    e.el.style.fontSize=(cell*0.42)+"px";
    e.el.textContent=t.v;
    e.el.style.transform=`translate(${gap+x*(cell+gap)}px,${gap+y*(cell+gap)}px)`;
  }
  scoreEl.textContent=score;
  if(score>best){best=score;localStorage.setItem("best2048",best);bestEl.textContent=best;}
}
// direction vectors: 0=up 1=right 2=down 3=left
function move(dir){
  if(over) return;
  const dx=[0,1,0,-1][dir], dy=[-1,0,1,0][dir];
  const xs=[...Array(N).keys()], ys=[...Array(N).keys()];
  if(dx>0)xs.reverse(); if(dy>0)ys.reverse();
  let moved=false;
  const merged=new Set();
  for(const y of ys)for(let x of xs){
    let cx=x,cy=y,nx,ny;
    while(true){
      nx=cx+dx; ny=cy+dy;
      if(nx<0||nx>=N||ny<0||ny>=N)break;
      const target=grid[ny][nx];
      if(!target){grid[ny][nx]=grid[cy][cx];grid[cy][cx]=null;cx=nx;cy=ny;moved=true;continue;}
      if(target.v===grid[cy][cx].v && !merged.has(target.id)){
        const src=grid[cy][cx];
        target.v*=2; score+=target.v; merged.add(target.id);
        tiles.get(src.id).el.remove(); tiles.delete(src.id);
        grid[cy][cx]=null; moved=true; break;
      }
      break;
    }
  }
  if(moved){add();render();check();}
}
function check(){
  if(emptyCells().length) return;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const v=grid[y][x]?.v;
    if(x+1<N&&grid[y][x+1]?.v===v)return;
    if(y+1<N&&grid[y+1][x]?.v===v)return;
  }
  over=true; msgEl.textContent="游戏结束！点新游戏再来";
}
// keyboard
addEventListener("keydown",e=>{
  const k={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3}[e.key];
  if(k!==undefined){e.preventDefault();move(k);}
});
// touch swipe
let sx=0,sy=0,swiping=false;
board.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;swiping=true;},{passive:true});
board.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
board.addEventListener("touchend",e=>{
  if(!swiping)return; swiping=false;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  move(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));
});
document.getElementById("btn").onclick=newGame;
addEventListener("resize",()=>render());
newGame();
</script>
</body>
</html>
