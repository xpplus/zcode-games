<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>2048 · ZCode Games</title>
<style>
  :root { --bg:#faf8ef; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
      touch-action:none; }
  body { font-family:"Segoe UI",system-ui,sans-serif;
         background:linear-gradient(rgba(250,248,239,.55),rgba(250,248,239,.55)),
                    url("bg.jpg") center/cover no-repeat fixed var(--bg);
         display:flex; flex-direction:column; align-items:center; min-height:100vh;
         user-select:none; }
  h1 { font-size:clamp(1.6rem,7vw,2.6rem); color:#776e65; margin:10px 0 4px;
       text-shadow:0 1px 6px rgba(250,248,239,.9); }
  .opts { display:flex; gap:8px; align-items:center; margin:4px 0;
          font-size:.85rem; color:#776e65; }
  .opts select { font-size:.85rem; padding:4px 6px; border:1px solid #bbada0;
                 border-radius:6px; background:rgba(255,255,255,.8); color:#776e65; }
  .bar { display:flex; gap:8px; margin:6px 0 12px; }
  .score { background:#bbada0; color:#fff; border-radius:6px; padding:6px 16px;
           text-align:center; min-width:80px; }
  .score small { display:block; font-size:.7rem; color:#eee; }
  .score b { font-size:1.2rem; }
  #board { position:relative; background:rgba(187,173,160,.55); border-radius:8px;
           width:min(92vw,440px); height:min(92vw,440px); }
  .cell { position:absolute; border-radius:6px; background:rgba(238,228,218,.5); }
  .tile { position:absolute; border-radius:6px; display:flex; align-items:center;
          justify-content:center; font-weight:700; transition:transform .08s ease;
          background:#eee4da; color:#776e65; }
  .t2{background:#eee4da}.t4{background:#ede0c8}.t8{background:#f2b179;color:#fff}
  .t16{background:#f59563;color:#fff}.t32{background:#f67c5f;color:#fff}
  .t64{background:#f65e3b;color:#fff}.t128{background:#edcf72;color:#fff}
  .t256{background:#edcc61;color:#fff}.t512{background:#edc850;color:#fff}
  .t1024{background:#edc53f;color:#fff}.t2048{background:#edc22e;color:#fff}
  .t4096{background:#6c5ce7;color:#fff}.t8192{background:#00b894;color:#fff}
  .t16384{background:#e17055;color:#fff}
  .super{background:#2d3436;color:#fff}
  #msg { margin-top:12px; color:#776e65; font-size:1rem; min-height:1.5em; }
  #btn { margin-top:4px; font-size:1rem; padding:10px 28px; border:0; border-radius:6px;
         background:#8f7a66; color:#fff; cursor:pointer; }
  .hint { margin-top:8px; color:#a89f94; font-size:.85rem; }
</style>
</head>
<body>
<h1>2048</h1>
<div class="opts">
  <label>棋盘 <select id="sizeSel">
    <option value="4">4×4</option><option value="5">5×5</option><option value="6">6×6</option>
  </select></label>
</div>
<div class="bar">
  <div class="score"><small>分数</small><b id="score">0</b></div>
  <div class="score"><small>最高</small><b id="best">0</b></div>
</div>
<div id="board"></div>
<div id="msg"></div>
<button id="btn">新游戏</button>
<div class="hint">滑动或用方向键移动方块</div>
<script>
"use strict";
/* ---- pure game state: grid[y][x] = null | {v, id} ----
   move() rebuilds each lane line-by-line from the destination wall;
   every cell is written exactly once per move, so grid/DOM can never
   half-update. N and spawn4 are variable: size/spawn rate are user options. */
let N=4;
let grid, score=0, best=0, over=false, idSeq=0;
try{
  best=+localStorage.getItem("best2048")||0;
  if(+localStorage.getItem("size2048"))N=+localStorage.getItem("size2048");
}catch(e){}

function newGame(){
  grid=Array.from({length:N},()=>Array(N).fill(null));
  score=0; over=false;
  addRandom(); addRandom();
}
function emptyCells(){
  const r=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!grid[y][x])r.push([x,y]);
  return r;
}
// spawn-4 probability ramps from 10% (max tile <= 64) to 35% (max tile >= 2048)
function spawnProb(){
  let m=0;
  for(const r of grid)for(const c of r)if(c&&c.v>m)m=c.v;
  if(m<=64)return 0.10;
  const t=(Math.log2(m)-6)/5;              // 64 -> 0, 2048 -> 1
  return 0.10+0.25*Math.max(0,Math.min(1,t));
}
function addRandom(){
  const c=emptyCells();
  if(!c.length)return null;
  const [x,y]=c[Math.random()*c.length|0];
  const t={v:Math.random()<spawnProb()?4:2,id:++idSeq};
  grid[y][x]=t;
  return t;
}
// dir: 0=up 1=right 2=down 3=left
// lane i indexes cells from the destination wall outward.
function move(dir){
  if(over)return false;
  const horiz=dir===1||dir===3, rev=dir===1||dir===2;
  const at=(i,line)=>horiz?[rev?N-1-i:i,line]:[line,rev?N-1-i:i];
  let changed=false, drops=[];
  for(let line=0;line<N;line++){
    const ts=[];                                     // occupied cells, wall-first
    for(let i=0;i<N;i++){
      const [x,y]=at(i,line), t=grid[y][x];
      if(t){ts.push({t,i});grid[y][x]=null;}
    }
    const out=[];
    for(let j=0;j<ts.length;j++){
      if(j+1<ts.length && ts[j].t.v===ts[j+1].t.v){  // merge pair
        out.push({v:ts[j].t.v*2,id:ts[j].t.id});
        drops.push(ts[j+1].t.id);
        score+=ts[j].t.v*2;
        j++; changed=true;
      }else out.push({v:ts[j].t.v,id:ts[j].t.id});
    }
    if(out.length!==ts.length||out.some((o,k)=>k!==ts[k].i))changed=true;
    out.forEach((o,k)=>{const [x,y]=at(k,line);grid[y][x]={v:o.v,id:o.id};});
  }
  if(!changed)return false;
  return {changed:true,drops};
}
function checkOver(){
  if(emptyCells().length)return false;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const v=grid[y][x].v;
    if(x+1<N&&grid[y][x+1].v===v)return false;
    if(y+1<N&&grid[y+1][x].v===v)return false;
  }
  return true;
}

/* ---- DOM layer ---- */
const board=document.getElementById("board"),
      scoreEl=document.getElementById("score"), bestEl=document.getElementById("best"),
      msgEl=document.getElementById("msg"),
      sizeSel=document.getElementById("sizeSel");
let tiles=new Map(), cells=[];
try{
  sizeSel.value=String(N);
}catch(e){}
bestEl.textContent=best;

// empty-cell slots behind the tiles so gaps and holes read as distinct
function buildCells(){
  board.innerHTML=""; tiles=new Map(); cells=[];
  for(let i=0;i<N*N;i++){
    const el=document.createElement("div");
    el.className="cell"; board.appendChild(el); cells.push(el);
  }
}
function render(){
  const size=board.clientWidth||300, gap=size/(N+1)/1.8, cell=(size-gap*(N+1))/N;
  const fs=cell*(N<=4?0.42:N===5?0.34:0.3);
  cells.forEach((el,i)=>{
    const x=i%N, y=i/N|0;
    el.style.width=el.style.height=cell+"px";
    el.style.transform=`translate(${gap+x*(cell+gap)}px,${gap+y*(cell+gap)}px)`;
  });
  const live=new Set();
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=grid[y][x]; if(!t)continue;
    live.add(t.id);
    let e=tiles.get(t.id);
    if(!e){e={el:document.createElement("div")};board.appendChild(e.el);tiles.set(t.id,e);}
    e.el.className="tile "+(t.v<=16384?"t"+t.v:"super");
    e.el.style.width=e.el.style.height=cell+"px";
    e.el.style.fontSize=fs+"px";
    e.el.textContent=t.v;
    e.el.style.transform=`translate(${gap+x*(cell+gap)}px,${gap+y*(cell+gap)}px)`;
  }
  for(const [id,e] of tiles) if(!live.has(id)){e.el.remove();tiles.delete(id);}
  scoreEl.textContent=score;
  if(score>best){best=score;try{localStorage.setItem("best2048",best);}catch(e){}
    bestEl.textContent=best;}
}
function step(dir){
  const r=move(dir);
  if(!r)return;
  for(const id of r.drops){const d=tiles.get(id);if(d){d.el.remove();tiles.delete(id);}}
  addRandom();
  render();
  if(checkOver()){over=true;msgEl.textContent="游戏结束！点新游戏再来";}
}
sizeSel.onchange=()=>{N=+sizeSel.value;try{localStorage.setItem("size2048",N);}catch(e){}
  buildCells();newGame();render();};
document.getElementById("btn").onclick=()=>{newGame();render();};
buildCells();
newGame();
render();

/* ---- input ---- */
addEventListener("keydown",e=>{
  const k={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3}[e.key];
  if(k!==undefined){e.preventDefault();step(k);}
});
let sx=0,sy=0,swiping=false;
addEventListener("touchstart",e=>{
  if(e.target.closest("button,select"))return;
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;swiping=true;e.preventDefault();
},{passive:false});
addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
addEventListener("touchend",e=>{
  if(!swiping)return; swiping=false;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;
  step(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));
});
addEventListener("touchcancel",()=>{swiping=false;});
addEventListener("resize",render);
</script>
</body>
</html>
