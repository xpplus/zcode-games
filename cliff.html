<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>悬崖对决 · ZCode Games</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:none; }
  html,body { height:100%; background:#22313f; overflow:hidden; user-select:none;
              font-family:"Segoe UI",system-ui,sans-serif; display:flex; align-items:center; justify-content:center; }
  #wrap { position:relative; }
  canvas { display:block; border-radius:10px; background:#35507a; }
  #over { position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
          justify-content:center; background:rgba(8,12,20,.75); border-radius:10px; color:#fff; }
  #over h2 { font-size:2rem; margin-bottom:18px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="over"><h2 id="otext"></h2><p>点击任意处再来一局</p></div>
</div>
<script src="matter.min.js"></script>
<script>
"use strict";
const {Engine,World,Bodies,Body,Events} = Matter;
const W=420, H=700, PLAT_Y=H-180, GAP=110;
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const overEl=document.getElementById("over"), otext=document.getElementById("otext");
function fit(){
  const s=Math.min(innerWidth/W, innerHeight/H);
  cv.style.width=(W*s)+"px"; cv.style.height=(H*s)+"px";
  cv.width=W*devicePixelRatio; cv.height=H*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener("resize",fit); fit();

const PLAYER={x:W*0.22,y:PLAT_Y-26}, AI={x:W*0.78,y:PLAT_Y-26};
let engine, stones=[], php=3, ahp=3, turn="player", aiming=false,
    aimStart=null, aimEnd=null, flyTimer=0, hitDone=false,
    aiTimer=0, over=false, particles=[], last=performance.now();

function newGame(){
  if(engine) World.clear(engine.world), Engine.clear(engine);
  engine=Engine.create(); engine.gravity.y=1;
  stones=[]; php=3; ahp=3; turn="player"; over=false;
  aiming=false; flyTimer=0; aiTimer=0; particles=[];
  const o={isStatic:true,friction:.4};
  World.add(engine.world,[
    Bodies.rectangle(W*0.25,PLAT_Y+30,W*0.5+30,60,o),
    Bodies.rectangle(W*0.75,PLAT_Y+30,W*0.5+30,60,o),
    Bodies.rectangle(-40,H/2,80,H*3,o),
    Bodies.rectangle(W+40,H/2,80,H*3,o)
  ]);
  overEl.style.display="none";
}
function pop(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=1+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,color});
  }
}
function throwStone(x,y,vx,vy,from){
  const b=Bodies.circle(x,y,8,{density:.002,restitution:.1,friction:.1});
  b.plugin={from};
  Body.setVelocity(b,{x:vx,y:vy});
  stones.push(b); World.add(engine.world,b);
}
function hitNear(b,who){
  return Math.hypot(b.position.x-who.x,b.position.y-who.y)<30;
}
function endFly(delay){
  setTimeout(()=>{
    for(const s of stones)World.remove(engine.world,s);
    stones=[];
    if(ahp<=0||php<=0){
      over=true;
      otext.textContent=ahp<=0?"你赢啦！":"惜败，再来！";
      overEl.style.display="flex";
      return;
    }
    if(turn==="player"){turn="ai";aiTimer=1.0;}
    else{turn="player";}
  },delay*1000);
}
// player input: drag anywhere, aim from your character
function toWorld(t){
  const r=cv.getBoundingClientRect(), s=W/r.width;
  return {x:(t.clientX-r.left)*s, y:(t.clientY-r.top)*s};
}
cv.addEventListener("touchstart",e=>{
  if(over){newGame();return;}
  if(turn!=="player")return;
  aiming=true; aimStart=toWorld(e.touches[0]); aimEnd=aimStart; e.preventDefault();
},{passive:false});
cv.addEventListener("touchmove",e=>{ if(aiming)aimEnd=toWorld(e.touches[0]); e.preventDefault(); },{passive:false});
cv.addEventListener("touchend",()=>{
  if(!aiming)return; aiming=false;
  const dx=aimEnd.x-PLAYER.x, dy=aimEnd.y-PLAYER.y, len=Math.hypot(dx,dy);
  if(len<18)return;
  const k=Math.min(15,len*0.07)/len;
  throwStone(PLAYER.x,PLAYER.y,dx*k,dy*k,"player");
  flyTimer=0.01; hitDone=false;
});
cv.addEventListener("mousedown",e=>{ if(over){newGame();return;} if(turn!=="player")return;
  aiming=true; aimStart={x:e.offsetX,y:e.offsetY}; aimEnd=aimStart; });
cv.addEventListener("mousemove",e=>{ if(aiming)aimEnd={x:e.offsetX,y:e.offsetY}; });
cv.addEventListener("mouseup",()=>{
  if(!aiming)return; aiming=false;
  const dx=aimEnd.x-PLAYER.x, dy=aimEnd.y-PLAYER.y, len=Math.hypot(dx,dy);
  if(len<18)return;
  const k=Math.min(15,len*0.07)/len;
  throwStone(PLAYER.x,PLAYER.y,dx*k,dy*k,"player");
  flyTimer=0.01; hitDone=false;
});
function aiThrow(){
  const dx=PLAYER.x-AI.x, dy=PLAYER.y-AI.y, t=0.9;
  const g=0.278*60;                       // px per step^2 scaled to seconds
  let vx=dx/t, vy=dy/t-0.5*g*t;
  vx*=0.8+Math.random()*0.45;             // sloppy aim on purpose
  vy*=0.85+Math.random()*0.4;
  throwStone(AI.x,AI.y,vx,vy,"ai");
  flyTimer=0.01; hitDone=false;
}
function drawAim(){
  const dx=aimEnd.x-PLAYER.x, dy=aimEnd.y-PLAYER.y, len=Math.hypot(dx,dy);
  if(len<18)return;
  const k=Math.min(15,len*0.07)/len;
  let px=PLAYER.x, py=PLAYER.y, vx=dx*k, vy=dy*k;
  ctx.fillStyle="rgba(255,255,255,.5)";
  for(let i=0;i<50;i++){
    vy+=0.278; px+=vx; py+=vy;
    if(i%3===0){ctx.beginPath();ctx.arc(px,py,3.5,0,7);ctx.fill();}
    if(py>PLAT_Y)break;
  }
}
function hearts(n,x,y){
  ctx.font="20px serif"; ctx.textAlign="left";
  for(let i=0;i<3;i++)ctx.fillText(i<n?"❤️":"🖤",x+i*24,y);
}
function render(dt){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#35507a"); g.addColorStop(1,"#5d7fa8");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // chasm
  ctx.fillStyle="#1a2733";
  ctx.beginPath();
  ctx.moveTo(W*0.5-GAP/2,H); ctx.lineTo(W*0.5-GAP/2,PLAT_Y+30);
  ctx.lineTo(W*0.5+GAP/2,PLAT_Y+30); ctx.lineTo(W*0.5+GAP/2,H);
  ctx.fill();
  // platforms
  ctx.fillStyle="#3d566e";
  ctx.fillRect(0,PLAT_Y+30,W*0.5-GAP/2,H-PLAT_Y-30);
  ctx.fillRect(W*0.5+GAP/2,PLAT_Y+30,W*0.5-GAP/2,H-PLAT_Y-30);
  ctx.fillStyle="#48688a";
  ctx.fillRect(0,PLAT_Y+30,W*0.5-GAP/2,8);
  ctx.fillRect(W*0.5+GAP/2,PLAT_Y+30,W*0.5-GAP/2,8);
  // characters
  ctx.font="44px serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("😀",PLAYER.x,PLAYER.y);
  ctx.fillText("🤖",AI.x,AI.y);
  for(const s of stones){
    ctx.beginPath(); ctx.arc(s.position.x,s.position.y,8,0,7);
    ctx.fillStyle="#2d3436"; ctx.fill();
  }
  for(const p of particles){
    ctx.globalAlpha=p.life; ctx.beginPath();
    ctx.arc(p.x,p.y,3.5*p.life,0,7); ctx.fillStyle=p.color; ctx.fill();
    ctx.globalAlpha=1;
  }
  hearts(php,14,32);
  hearts(ahp,W-86,32);
  ctx.font="15px sans-serif"; ctx.fillStyle="#fff"; ctx.textAlign="center";
  if(turn==="player"&&!over)ctx.fillText("轮到你：按住拖动瞄准，松手扔石头",W/2,60);
  else if(!over)ctx.fillText("对手瞄准中…",W/2,60);
  if(aiming)drawAim();
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(!over){
    Engine.update(engine,1000/60);
    for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life-=.03;}
    particles=particles.filter(p=>p.life>0);
    if(flyTimer>0){
      flyTimer+=dt;
      for(const s of stones){
        if(s.position.y>H+50){World.remove(engine.world,s);}
      }
      stones=stones.filter(s=>s.position.y<H+50);
      if(flyTimer>4&&stones.length===0&&turn!=="switch"){
        // stone flew off or stalled: pass turn
        flyTimer=0;
        for(const s of stones)World.remove(engine.world,s);
        stones=[];
        if(turn==="player"){turn="ai";aiTimer=0.8;}
        else turn="player";
      }
    }
    if(turn==="ai"&&stones.length===0){
      aiTimer-=dt;
      if(aiTimer<=0)aiThrow();
    }
  }
  render(dt);
  requestAnimationFrame(loop);
}
newGame();
Events.on(engine,"collisionStart",e=>{
  if(flyTimer<=0||hitDone)return;
  for(const p of e.pairs){
    for(const b of [p.bodyA,p.bodyB]){
      const st=b.plugin&&b.plugin.from?b:null;
      if(!st)continue;
      const other=st===p.bodyA?p.bodyB:p.bodyA;
      // characters are identified by position proximity
      if(turn==="player"&&hitNear(other,AI)){hitDone=true;ahp--;pop(AI.x,AI.y,"#ff7675",16);endFly(0.9);}
      else if(turn==="ai"&&hitNear(other,PLAYER)){hitDone=true;php--;pop(PLAYER.x,PLAYER.y,"#ff7675",16);endFly(0.9);}
    }
  }
});
requestAnimationFrame(loop);
</script>
</body>
</html>
